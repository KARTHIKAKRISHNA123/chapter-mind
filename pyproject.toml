[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-splitter"
version = "0.9.0"
description = "Deterministic, format-agnostic book -> chapter splitter (DOCX, EPUB)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karthika Krishna M" }]
keywords = ["docx", "epub", "split", "chapters", "document-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Topic :: Office/Business",
]
dependencies = [
    "lxml>=4.9",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
    "types-beautifulsoup4",
]

[project.urls]
Homepage = "https://github.com/KarthikaKrishna123/book-splitter"
Repository = "https://github.com/KarthikaKrishna123/book-splitter"
Issues = "https://github.com/KarthikaKrishna123/book-splitter/issues"

[project.scripts]
book-splitter = "book_splitter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["book_splitter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "regression: marks tests as regression tests (deselect with '-m \"not regression\"')",
    "performance: bounded-memory / timing tests",
    "fidelity: split-and-verify preservation tests (require golden DOCX books on disk)",
]
